<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Captioning Tool</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
    {
        "imports": {
            "config": "./config.js"
        }
    }
    </script>
</head>
<body>
    <div class="container">
        <h1>Audio Captioning Tool</h1>
        
        <div class="audio-player">
            <audio id="audioPlayer" src="/UwU Doki Doki.wav" controls></audio>
            <div class="controls">
                <button id="markTimeBtn">Mark Current Time</button>
                <button id="playPauseBtn">Play/Pause</button>
                <button id="exportBtn">Export Captions</button>
            </div>
        </div>
        
        <div class="timeline">
            <div id="progressBar">
                <div id="progress"></div>
                <div id="timeMarkers"></div>
            </div>
        </div>
        
        <div class="captions-container">
            <h2>Captions</h2>
            <div id="captionsList"></div>
        </div>
    </div>
    
    <script type="module" src="app.js"></script>
